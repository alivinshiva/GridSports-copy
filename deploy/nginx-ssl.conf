# Main Frontend - Redirect HTTP to HTTPS
server {
    listen 80;
    server_name gridsports.showgrid.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gridsports.showgrid.ai;

    ssl_certificate /etc/letsencrypt/live/gridsports.showgrid.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gridsports.showgrid.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

