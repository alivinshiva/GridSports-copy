name: Deploy adBackend to Production

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - prod
    paths:
      - 'adBackend/**'
      - '.github/workflows/deploy-adbackend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          cd adBackend
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/adbackend:latest
          IMAGE_SHA=ghcr.io/${{ github.repository_owner }}/adbackend:${{ github.sha }}
          
          docker build -t $IMAGE_NAME -t $IMAGE_SHA .
          docker push $IMAGE_NAME
          docker push $IMAGE_SHA
          
          echo "Pushed: $IMAGE_NAME"
          echo "Pushed: $IMAGE_SHA"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            # Login to GitHub Container Registry
            echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            
            # Pull the new image
            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/adbackend:latest"
            docker pull $IMAGE_NAME
            
            # Run the deployment script with the image name
            export DOCKER_IMAGE=$IMAGE_NAME
            bash /opt/deploy/adbackend-deploy.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            # Check if container is running
            if docker ps | grep -q adbackend; then
              echo "✅ adBackend container is running"
              docker ps | grep adbackend
            else
              echo "❌ adBackend container failed to start"
              docker logs adbackend --tail 50
              exit 1
            fi

      - name: Cleanup old images on server
        uses: appleboy/ssh-action@v1.0.3
        if: success()
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            # Remove dangling images to save space
            docker image prune -f
